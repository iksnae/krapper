name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y zsh
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bb.tar.gz" https://github.com/babashka/babashka/releases/download/v1.13.230/babashka-1.13.230-linux-amd64-static.tar.gz
          echo "ffa98e905c75b6b13eb0b644b778219205180569bfe6004a3e35c3a9798a145d  $RUNNER_TEMP/bb.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bb"
          tar -xzf "$RUNNER_TEMP/bb.tar.gz" -C "$RUNNER_TEMP/bb"
          echo "$RUNNER_TEMP/bb" >> "$GITHUB_PATH"
          python -m pip install -e '.[dev]'
      - name: Branch coverage and self-analysis
        run: >-
          krapper --coverage-command
          'mkdir -p target/coverage/python &&
          COVERAGE_FILE=target/coverage/python/.coverage python -m coverage run --branch --source=src/crapper -m pytest -q &&
          COVERAGE_FILE=target/coverage/python/.coverage python -m coverage lcov -o target/coverage/python/lcov.info'
          src/crapper
      - name: CLI smoke test
        run: krapper --help
